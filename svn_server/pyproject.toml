[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svn-server-admin"
version = "0.1.0"
description = "Linux desktop GUI for Subversion repository management"
readme = "README.md"
license = { text="LGPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "SVN Suite Team"}]
keywords = ["svn", "subversion", "gui", "server", "admin", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "PySide6>=6.7",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
svn-server-admin = "svn_server.__main__:main"

[tool.setuptools.packages.find]
include = ["svn_server*", "svn_shared*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests", "../svn_shared/tests"]
markers = [
    "integration: requires real SVN CLI",
    "ui: requires display server or xvfb",
]
