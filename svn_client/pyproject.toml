[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svn-client"
version = "0.1.0"
description = "Linux desktop GUI for Subversion working copy operations"
readme = "README.md"
license = { text="LGPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "URVIL SUTHAR"}]
keywords = ["svn", "subversion", "gui", "client", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "PySide6>=6.7",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
svn-client = "svn_client.__main__:main"

[tool.setuptools]
packages = ["svn_client", "svn_shared", "svn_shared.widgets"]

[tool.setuptools.package-data]
svn_client = ["resources/icons/*.ico", "resources/icons/*.png"]
svn_shared = ["resources/styles/*.qss"]

# `svn_client` is this project's own flat-layout package (its files sit
# directly here, in the pyproject.toml's own directory), while `svn_shared`
# is a sibling package one level up in the monorepo that this project
# depends on but doesn't own. sdist packaging can't reach outside the
# project directory, so `svn_shared` must be vendored (physically copied)
# into svn_shared/ here before building -- run scripts/vendor-shared.sh
# first (scripts/build-all.sh does this automatically).
[tool.setuptools.package-dir]
svn_client = "."
svn_shared = "svn_shared"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests", "../svn_shared/tests"]
markers = [
    "integration: requires real SVN CLI",
    "ui: requires display server or xvfb",
]
