# Flatpak manifest for SVN Client
#
# Prerequisites on the build host:
#   flatpak install flathub org.kde.Platform//6.8 org.kde.Sdk//6.8
#   flatpak install flathub org.freedesktop.Sdk.Extension.python313//24.08
#
# Generate Python wheel sources (run once, check the result into version control):
#   pip install flatpak-pip-generator
#   flatpak-pip-generator PySide6 keyring --output python-deps
#   # produces python-deps.json  — include it below under sources
#
# Build:
#   flatpak-builder --force-clean --install --user build-dir \
#       svn_client/flatpak/org.svnsuite.SvnClient.yml

app-id: org.svnsuite.SvnClient

runtime: org.kde.Platform
runtime-version: "6.8"

sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.python313//24.08

command: svn-client

finish-args:
  # Wayland + X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Access working copies on the host filesystem
  - --filesystem=home
  # SVN over network (http/https/svn+ssh)
  - --share=network
  # D-Bus session bus for keyring (SecretService)
  - --socket=session-bus
  # SSH agent forwarding for svn+ssh
  - --socket=ssh-auth

build-options:
  # Activate the Python 3.13 SDK extension during build
  append-path: /usr/lib/sdk/python313/bin
  env:
    PYTHON: python3
    PIP: pip3
    PYTHONDONTWRITEBYTECODE: "1"

modules:
  # ------------------------------------------------------------------
  # 1. Install Python 3.13 into /app
  # ------------------------------------------------------------------
  - name: python313
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/python313/install.sh
    sources: []

  # ------------------------------------------------------------------
  # 2. Python dependencies (PySide6, keyring, SecretStorage)
  #    Replace the "type: file" entries below with the output of
  #    flatpak-pip-generator for offline / reproducible builds.
  #    For development builds with network access use --allow-wget.
  # ------------------------------------------------------------------
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=. --prefix=/app
          PySide6-Essentials PySide6-Addons keyring SecretStorage jeepney
    # sources generated by:
    #   flatpak-pip-generator PySide6 keyring SecretStorage jeepney \
    #     --output python-deps
    sources:
      - type: file
        path: python-deps.json
        # Generated file — run flatpak-pip-generator before first build.
        # Remove this block and add --allow-wget to flatpak-builder for
        # development-only network builds.

  # ------------------------------------------------------------------
  # 3. Subversion CLI (svn, svnadmin, svnlook)
  # ------------------------------------------------------------------
  - name: subversion
    buildsystem: simple
    build-commands:
      # Copy subversion binaries and libraries from the SDK
      - install -Dm755 /usr/bin/svn       /app/bin/svn
      - install -Dm755 /usr/bin/svnadmin  /app/bin/svnadmin
      - install -Dm755 /usr/bin/svnlook   /app/bin/svnlook
    sources: []

  # ------------------------------------------------------------------
  # 4. SVN Client application
  # ------------------------------------------------------------------
  - name: svn-client
    buildsystem: simple
    build-commands:
      # Install svn_shared first (dependency)
      - pip3 install --prefix=/app ../svn_shared
      # Install svn_client
      - pip3 install --prefix=/app .
      # Desktop integration files
      - install -Dm644 resources/org.svnsuite.SvnClient.desktop
          /app/share/applications/org.svnsuite.SvnClient.desktop
      - install -Dm644 resources/icons/org.svnsuite.SvnClient.svg
          /app/share/icons/hicolor/scalable/apps/org.svnsuite.SvnClient.svg
      - install -Dm644 resources/org.svnsuite.SvnClient.metainfo.xml
          /app/share/metainfo/org.svnsuite.SvnClient.metainfo.xml
    sources:
      - type: dir
        path: ../..
        # Builds from the workspace root so both svn_shared/ and svn_client/ are accessible
